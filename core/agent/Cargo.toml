[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../../storage/common" }
memory = { path = "../memory" }
home = { path = "../home" }
session = { path = "../../storage/session" }
usage = { path = "../../storage/usage" }
orchestration = { path = "../orchestration" }
delegate = { path = "../delegate" }
cron = { path = "../../automation/cron" }
skills = { path = "../skills" }
providers = { path = "../providers" }
tools = { path = "../../actions/tools" }
mcp = { path = "../../extensions/mcp" }
a2ui = { path = "../../actions/a2ui" }
artifacts = { path = "../../storage/artifacts" }
hooks = { path = "../../extensions/hooks" }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
