// Astro Agent gRPC 协议：桌面壳 / 独立 backend 共用的服务与消息定义。
//
syntax = "proto3";
package astro;

// 核心 RPC：聊天流、控制、图片、技能、MCP、记忆与沙箱文件。
service AstroService {
  // 多轮流式对话：token / reasoning / tool_call / usage / done 等事件。
  rpc Chat(ChatRequest) returns (stream ChatEvent);
  // 对进行中的 Chat 流执行暂停 / 继续 / 取消。
  rpc ChatControl(ChatControlRequest) returns (Empty);
  // 校验并登记 interrupt 的 resume 项（随后 Chat 携带 resume_json 续跑）。
  rpc InterruptResume(InterruptResumeRequest) returns (Empty);
  // 文生图流：进度、图片字节或错误。
  rpc GenerateImage(ImageRequest) returns (stream ImageEvent);
  // 列出已安装且可用于提示的技能。
  rpc ListSkills(Empty) returns (SkillList);
  // 执行指定技能，流式返回输出。
  rpc ExecuteSkill(SkillRequest) returns (stream SkillEvent);
  // 列出 MCP 服务器连接状态与工具名。
  rpc ListMcpServers(Empty) returns (McpServerList);
  // 按查询召回 MEMORY / USER 与近期会话摘要。
  rpc QueryMemory(MemoryQuery) returns (MemoryResult);
  // 在记忆沙箱内列举文件（受根目录约束）。
  rpc ListFiles(FileListRequest) returns (FileListResponse);
  // 会话级副作用事件（记忆更新 / pending 变化）；与 Chat 流生命周期解耦。
  rpc SubscribeSessionEvents(SubscribeSessionEventsRequest) returns (stream SessionEvent);
}

// 空请求/响应占位。
message Empty {}

// 聊天后备目标（不含 primary；primary 仍用 ChatRequest 字段 3/4/7/8）。
message ChatFallbackTarget {
  string provider = 1;   // backend_id（registry）
  string model = 2;
  string api_key = 3;
  string base_url = 4;
  string provider_id = 5; // providers.json 条目 id，可空
}

// 单条辅助模型已解析目标（title_generation / compaction / smart_approval /
// dreaming / background_review 之一），随 ChatRequest 透传给 backend 更新
// AgentLoop 的 auxiliary_targets；仅存于内存，不落盘。
message AuxiliaryModelTarget {
  string task = 1;        // 对齐 common::AuxiliaryTask::as_str()
  string provider_id = 2;  // providers.json 条目 id，可空（回退主模型时为空）
  string backend_id = 3;   // registry backend id
  string model = 4;
  string api_key = 5;
  string base_url = 6;
  uint32 order = 7;        // 0 = preferred，1 = fallback
}

// 发起一轮聊天所需的会话、模型与工具/图片凭证。
message ChatRequest {
  string session_id = 1;   // 空则服务端生成新 UUID
  string content = 2;      // 用户输入
  string provider = 3;     // 供应商 id，空则 ollama
  string model = 4;
  repeated string tool_names = 5; // 允许的工具名列表（可空=默认）
  bool use_memory = 6;
  // 由前端从 keyring / providers.json 注入；空则后端回退环境变量
  string api_key = 7;
  string base_url = 8;
  // 图片生成主提供商凭证（Tauri 从已开启的 Google/OpenAI 解析）
  string image_gen_provider = 9;
  string image_gen_model = 10;
  string image_gen_api_key = 11;
  string image_gen_base_url = 12;
  // 备用图片生成凭证
  string image_gen_fallback_provider = 13;
  string image_gen_fallback_model = 14;
  string image_gen_fallback_api_key = 15;
  string image_gen_fallback_base_url = 16;
  // DeepSeek V4 thinking 控制（前端输入框）
  bool thinking_enabled = 17;
  string reasoning_effort = 18;
  // JSON array of InterruptResumeItem；session 有 pending interrupt 时必填
  string resume_json = 19;
  // 不含 primary 的聊天后备链（最多 3；由前端 expand 后下传）
  repeated ChatFallbackTarget chat_fallbacks = 20;
  // 媒体生成模型覆盖（空=后端默认）；挂在 primary / fallback 供应商上
  string image_gen_video_model = 21;
  string image_gen_tts_model = 22;
  string image_gen_fallback_tts_model = 23;
  string image_gen_vision_model = 24;
  string image_gen_fallback_vision_model = 25;
  // 本轮用户图片附件（mime + raw base64；由 Tauri 内联，不经 extra_body）
  repeated ChatImageAttachment images = 26;
  // Google 音乐生成模型覆盖（空=lyria-3-clip-preview）
  string image_gen_music_model = 27;
  // 五类辅助任务已解析目标（每类最多 preferred + fallback 两项）；由 Tauri 端解析后下传
  repeated AuxiliaryModelTarget auxiliary_targets = 28;
  // 主模型上下文窗口（token）；0 = 后端用默认 128k；用于分阶段 tool 压缩
  uint32 context_window = 29;
  // 主模型最大输出 token（来自模型元数据）；0 = 后端用默认（8192）
  uint32 max_output_tokens = 30;
  // 交互模式：agent | plan | ask | multitask（空=agent）；用于 Plan/Ask 工具门禁
  string interaction_mode = 31;
  // MultiTask / 委派隔离：非空则 AgentLoop 以该路径为 project_root（file_ops/terminal 沙箱根）
  string project_root = 32;
}

// 聊天多模态图片附件（OpenAI 兼容 image_url 的 data URL 原料）。
message ChatImageAttachment {
  string mime = 1;
  string data_base64 = 2;
}

// Chat 流控制动作。
enum ChatControlAction {
  CHAT_CONTROL_UNSPECIFIED = 0;
  CHAT_CONTROL_PAUSE = 1;
  CHAT_CONTROL_RESUME = 2;
  CHAT_CONTROL_CANCEL = 3;
  // 与 RESUME 同义：仅恢复流式生成，不可用于回答 interrupt
  CHAT_CONTROL_STREAM_RESUME = 4;
  // UI 新建对话：卸内存会话并触发 command:new_chat / on_session_reset / finalize
  CHAT_CONTROL_NEW_CHAT = 5;
  // 从磁盘重载活会话 AgentLoop 的 MEMORY/USER frozen snapshot
  CHAT_CONTROL_REFRESH_MEMORY = 6;
  // 仅释放后端会话运行时；不触发 new_chat hooks，冷会话与重复调用均成功
  RELEASE_SESSION = 7;
}

message ChatControlRequest {
  string session_id = 1;
  ChatControlAction action = 2;
}

// Token 用量（OpenAI 风格字段）。
message UsageEvent {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
}

// 上下文占用分层片段（count=0 表示未设置）。
message ContextUsageSegment {
  string id = 1;
  uint32 tokens = 2;
  uint32 count = 3;
}

// 本轮 API 请求前的上下文占用估算。
message ContextUsageEvent {
  uint32 context_window = 1;
  uint32 total_tokens = 2;
  repeated ContextUsageSegment segments = 3;
  int64 updated_at = 4;
  // 建议前端提示会话级 /compact（占用临界）
  bool recommend_compact = 5;
}

// Chat 流的单条事件（oneof 互斥）。
message ChatEvent {
  oneof payload {
    string token = 1;
    ToolCallEvent tool_call = 2;
    MemoryUpdateEvent memory_update = 3;
    string error = 4;
    bool done = 5;
    // DeepSeek 等模型的 thinking / reasoning_content 流
    string reasoning = 6;
    UsageEvent usage = 7;
    // 原生 function calling 流式片段
    ToolCallDeltaEvent tool_call_delta = 8;
    // AG-UI ACTIVITY_SNAPSHOT（A2UI 等）
    ActivityEvent activity = 9;
    RunStartedEvent run_started = 10;
    RunFinishedEvent run_finished = 11;
    // Plugin / Gateway / Shell 生命周期钩子（非 memory）
    HookEvent hook = 12;
    ContextUsageEvent context_usage = 13;
  }
}

// Plugin Hooks 等生命周期事件（UI 时间线；与 MemoryUpdate 分流）。
message HookEvent {
  string name = 1;
  string detail = 2;
  string outcome = 3;
}

// 结构化活动快照（如 activity_type = "a2ui-surface"）。
message ActivityEvent {
  string message_id = 1;
  string activity_type = 2;
  // 通常为 {"operations":[...]} JSON
  string content_json = 3;
  bool replace = 4;
}

message RunStartedEvent {
  string thread_id = 1;
  string run_id = 2;
}

message Interrupt {
  string id = 1;
  // tool_call | input_required | confirmation
  string reason = 2;
  string message = 3;
  string tool_call_id = 4;
  string response_schema_json = 5;
  string expires_at = 6;
  string metadata_json = 7;
}

message RunFinishedEvent {
  string run_id = 1;
  // "success" | "interrupt"
  string outcome_type = 2;
  repeated Interrupt interrupts = 3;
}

message InterruptResumeItem {
  string interrupt_id = 1;
  // resolved | cancelled
  string status = 2;
  string payload_json = 3;
}

message InterruptResumeRequest {
  string session_id = 1;
  repeated InterruptResumeItem resume = 2;
}

// 完整工具调用结果（含执行输出）。
message ToolCallEvent {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
  string result = 4;
  // 结构化媒体（生成图/音/视频）；旧客户端可忽略。
  repeated MediaAsset media = 5;
}

// 统一媒体资产（对齐 common::MediaAsset）。
message MediaAsset {
  // image | audio | video | file
  string kind = 1;
  string mime_type = 2;
  // workspace_path | data_url | remote_uri
  string ref_kind = 3;
  string ref_value = 4;
  string label = 5;
  string id = 6;
}

// 工具调用参数的流式增量。
message ToolCallDeltaEvent {
  uint32 index = 1;
  string id = 2;
  string name = 3;
  // 参数 JSON 增量片段（可能不完整）
  string arguments = 4;
}

message MemoryUpdateEvent {
  string operation = 1;
  string content = 2;
}

message ImageRequest {
  string prompt = 1;
  string provider = 2;
  string model = 3;
  int32 width = 4;
  int32 height = 5;
  int32 count = 6;
  string api_key = 7;
  string base_url = 8;
}

message ImageEvent {
  oneof payload {
    string progress = 1;
    bytes image_data = 2;
    string error = 3;
  }
}

message SkillRequest { string name = 1; string params_json = 2; }
message SkillEvent { oneof payload { string output = 1; string error = 2; bool done = 3; } }
message SkillList { repeated SkillInfo skills = 1; }
message SkillInfo { string name = 1; string description = 2; string category = 3; }

message McpServerList { repeated McpServerInfo servers = 1; }
message McpServerInfo { string name = 1; string status = 2; repeated string tools = 3; }

message MemoryQuery { string query = 1; int32 limit = 2; }
message MemoryResult { string memory_content = 1; string user_content = 2; repeated SessionSnippet sessions = 3; }
message SessionSnippet { string session_id = 1; string summary = 2; }

message FileListRequest { string path = 1; int32 depth = 2; }
message FileListResponse { repeated FileEntry entries = 1; }
message FileEntry { string path = 1; bool is_dir = 2; int64 size = 3; }

message SubscribeSessionEventsRequest {
  // 空 = 只收全局 pending；非空 = 该 session + 全局 pending
  string session_id = 1;
  // 可选 agent 过滤；空 = 不过滤
  string agent_id = 2;
}

message SessionEvent {
  string session_id = 1;
  string agent_id = 2;
  int64 ts_ms = 3;
  oneof payload {
    MemoryUpdatedEvent memory_updated = 10;
    PendingChangedEvent pending_changed = 11;
    SessionMetadataChangedEvent session_metadata_changed = 12;
  }
}

message MemoryUpdatedEvent {
  string source = 1;   // review | approve | dreaming | tool
  string target = 2;   // memory | user | mixed
  string summary = 3;
  bool live_written = 4;
}

message PendingChangedEvent {
  uint32 pending_count = 1;
  string reason = 2;   // enqueued | approved | rejected
}

message SessionMetadataChangedEvent {
  string title = 1;
}
