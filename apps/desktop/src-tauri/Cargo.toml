[package]
name = "astro-agent"
version = "0.1.0"
description = "Astro Agent Tauri frontend"
authors = ["Astro Agent"]
edition = "2021"

[lib]
name = "astro_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "astro-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.8"
tauri-plugin-clipboard = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proto = { path = "../../../crates/agent-proto" }
agent-protocol = { path = "../../../crates/agent-protocol" }
agent-rollout = { path = "../../../crates/agent-rollout" }
types = { path = "../../../crates/agent-types" }
memory = { path = "../../../crates/agent-memory" }
sandbox = { path = "../../../crates/agent-sandbox" }
home = { path = "../../../crates/agent-home" }
cron = { path = "../../../crates/agent-cron" }
artifacts = { path = "../../../crates/agent-artifacts" }
usage = { path = "../../../crates/agent-usage" }
subagents = { path = "../../../crates/agent-subagents" }
session = { path = "../../../crates/agent-session" }
agent = { path = "../../../crates/agent-core" }
hooks = { path = "../../../crates/agent-hooks" }
server = { path = "../../../crates/agent-server" }
tools = { path = "../../../crates/agent-tools" }
mcp = { path = "../../../crates/agent-mcp" }
providers = { path = "../../../crates/agent-providers" }
skills = { path = "../../../crates/agent-skills" }
evolution = { path = "../../../crates/agent-evolution" }
workflow = { path = "../../../crates/agent-workflow" }
chrono = { version = "0.4", features = ["clock"] }
url = "2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "macos-system-configuration"] }
futures = "0.3"
base64 = "0.22"
trash = "5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
