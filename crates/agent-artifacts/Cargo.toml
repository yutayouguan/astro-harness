[package]
name = "artifacts"
version = "0.1.0"
edition = "2021"
description = "文件空间索引（artifacts.db）"

[dependencies]
anyhow = { workspace = true }
types = { path = "../agent-types" }
home = { path = "../agent-home" }
agent-db = { path = "../agent-db" }
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
