[package]
name = "subagents"
version = "0.1.0"
edition = "2021"
description = "Codex-style first-class subagent threads, custom agent configuration, and lifecycle control"

[dependencies]
agent-config = { path = "../agent-config" }
anyhow = { workspace = true }
types = { path = "../agent-types" }
home = { path = "../agent-home" }
hooks = { path = "../agent-hooks" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { version = "0.4", features = ["clock", "serde"] }
agent-db = { path = "../agent-db" }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
agent = { path = "../agent-core", features = ["test-support"] }
