[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
proto = { path = "../agent-proto" }
common = { path = "../agent-types" }
agent = { path = "../agent-core" }
providers = { path = "../agent-providers" }
memory = { path = "../agent-memory" }
session = { path = "../agent-session" }
home = { path = "../agent-home" }
cron = { path = "../agent-cron" }
workflow = { path = "../agent-workflow" }
skills = { path = "../agent-skills" }
hooks = { path = "../agent-hooks" }
tools = { path = "../agent-tools" }
mcp = { path = "../agent-mcp" }
tonic = "0.11"
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
