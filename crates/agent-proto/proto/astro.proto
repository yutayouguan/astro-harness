// Astro Agent gRPC 协议：桌面壳 / 独立 backend 共用的服务与消息定义。
//
syntax = "proto3";
package astro;

// 核心 RPC：Thread 提交/订阅、控制、图片、技能、MCP、记忆与沙箱文件。
service AstroService {
  // 对进行中的 Chat 流执行暂停 / 继续 / 取消。
  rpc ChatControl(ChatControlRequest) returns (Empty);
  // 将用户补充指令注入当前活动 turn；在下一次模型采样前消费。
  rpc SteerChat(SteerChatRequest) returns (SteerChatResponse);
  // One long-lived outbound stream per client connection.
  rpc SubscribeThreadEvents(SubscribeThreadEventsRequest)
      returns (stream ThreadEvent);
  // Submit one user input operation to a loaded or newly created Thread.
  rpc SubmitTurn(SubmitTurnRequest) returns (SubmitTurnResponse);
  rpc RealtimeConversationStart(RealtimeConversationStartRequest)
      returns (RealtimeOperationResponse);
  rpc RealtimeConversationAudio(RealtimeConversationAudioRequest)
      returns (RealtimeOperationResponse);
  rpc RealtimeConversationText(RealtimeConversationTextRequest)
      returns (RealtimeOperationResponse);
  rpc RealtimeConversationSpeech(RealtimeConversationSpeechRequest)
      returns (RealtimeOperationResponse);
  rpc RealtimeConversationClose(RealtimeConversationRequest)
      returns (RealtimeOperationResponse);
  rpc RealtimeConversationListVoices(RealtimeConversationRequest)
      returns (RealtimeVoicesResponse);
  // Rebuild durable history, merge an active snapshot, and subscribe the connection.
  rpc ResumeThread(ResumeThreadRequest) returns (ResumeThreadResponse);
  // Stop routing one Thread to a connection without stopping the Thread.
  rpc UnsubscribeThread(UnsubscribeThreadRequest) returns (Empty);
  // 校验并登记 interrupt 的 resume 项（随后 Chat 携带 resume_json 续跑）。
  rpc InterruptResume(InterruptResumeRequest) returns (Empty);
  rpc ResolveElicitation(ResolveElicitationRequest) returns (Empty);
  rpc UpdateTurnSettings(UpdateTurnSettingsRequest) returns (UpdateTurnSettingsResponse);
  rpc ApproveGuardianDeniedAction(ApproveGuardianDeniedActionRequest) returns (Empty);
  rpc RunUserShellCommand(RunUserShellCommandRequest) returns (RunUserShellCommandResponse);
  rpc OpenTerminal(TerminalOpenRequest) returns (TerminalSessionResponse);
  rpc ReadTerminal(TerminalReadRequest) returns (TerminalReadResponse);
  rpc WriteTerminal(TerminalWriteRequest) returns (Empty);
  rpc ResizeTerminal(TerminalResizeRequest) returns (Empty);
  rpc KillTerminal(TerminalIdRequest) returns (Empty);
  // 文生图流：进度、图片字节或错误。
  rpc GenerateImage(ImageRequest) returns (stream ImageEvent);
  // 列出已安装且可用于提示的技能。
  rpc ListSkills(Empty) returns (SkillList);
  // 执行指定技能，流式返回输出。
  rpc ExecuteSkill(SkillRequest) returns (stream SkillEvent);
  // 列出 MCP 服务器连接状态与工具名。
  rpc ListMcpServers(McpServerListRequest) returns (McpServerList);
  // 清除指定 Server 的退避并立即重连。
  rpc ReconnectMcpServer(McpReconnectRequest) returns (McpServerList);
  // 按查询召回 MEMORY / USER 与近期会话摘要。
  rpc QueryMemory(MemoryQuery) returns (MemoryResult);
  // 在记忆沙箱内列举文件（受根目录约束）。
  rpc ListFiles(FileListRequest) returns (FileListResponse);
  // 统计消息 + 工具的 token 数（Anthropic count_tokens）。
  rpc CountTokens(CountTokensRequest) returns (CountTokensResponse);
  // Anthropic Message Batches：创建 / 查询 / 列表 / 结果。
  rpc CreateBatch(BatchCreateRequest) returns (BatchResponse);
  rpc GetBatch(BatchStatusRequest) returns (BatchResponse);
  rpc ListBatches(BatchListRequest) returns (BatchResponse);
  rpc GetBatchResults(BatchStatusRequest) returns (BatchResultsResponse);
}

// 空请求/响应占位。
message Empty {}

// 聊天后备目标（不含 primary；primary 仍用 ChatRequest 字段 3/4/7/8）。
message ChatFallbackTarget {
  string provider = 1;   // backend_id（registry）
  string model = 2;
  string api_key = 3;
  string base_url = 4;
  string provider_id = 5; // providers.json 条目 id，可空
  reserved 6;
}

// 单条辅助模型已解析目标（title_generation / compaction / smart_approval /
// dreaming / background_review 之一），随 ChatRequest 透传给 backend 更新
// AgentLoop 的 auxiliary_targets；仅存于内存，不落盘。
message AuxiliaryModelTarget {
  string task = 1;        // 对齐 common::AuxiliaryTask::as_str()
  string provider_id = 2;  // providers.json 条目 id，可空（回退主模型时为空）
  string backend_id = 3;   // registry backend id
  string model = 4;
  string api_key = 5;
  string base_url = 6;
  uint32 order = 7;        // 0 = preferred，1 = fallback
}

// 发起一轮聊天所需的会话、模型与工具/图片凭证。
message ChatRequest {
  string session_id = 1;   // 空则服务端生成新 UUID
  string content = 2;      // 用户输入
  string provider = 3;     // 供应商 id，空则 ollama
  string model = 4;
  repeated string tool_names = 5; // 允许的工具名列表（可空=默认）
  bool use_memory = 6;
  // 由前端从 keyring / providers.json 注入；空则后端回退环境变量
  string api_key = 7;
  string base_url = 8;
  // 图片生成主提供商凭证（Tauri 从已开启的 Google/OpenAI 解析）
  string image_gen_provider = 9;
  string image_gen_model = 10;
  string image_gen_api_key = 11;
  string image_gen_base_url = 12;
  // 备用图片生成凭证
  string image_gen_fallback_provider = 13;
  string image_gen_fallback_model = 14;
  string image_gen_fallback_api_key = 15;
  string image_gen_fallback_base_url = 16;
  // DeepSeek V4 thinking 控制（前端输入框）
  bool thinking_enabled = 17;
  string reasoning_effort = 18;
  // JSON array of InterruptResumeItem；session 有 pending interrupt 时必填
  string resume_json = 19;
  // 不含 primary 的聊天后备链（最多 3；由前端 expand 后下传）
  repeated ChatFallbackTarget chat_fallbacks = 20;
  // 媒体生成模型覆盖（空=后端默认）；挂在 primary / fallback 供应商上
  string image_gen_video_model = 21;
  string image_gen_tts_model = 22;
  string image_gen_fallback_tts_model = 23;
  string image_gen_vision_model = 24;
  string image_gen_fallback_vision_model = 25;
  // 本轮用户图片附件（mime + raw base64；由 Tauri 内联，不经 extra_body）
  repeated ChatImageAttachment images = 26;
  // Google 音乐生成模型覆盖（空=lyria-3-clip-preview）
  string image_gen_music_model = 27;
  // 五类辅助任务已解析目标（每类最多 preferred + fallback 两项）；由 Tauri 端解析后下传
  repeated AuxiliaryModelTarget auxiliary_targets = 28;
  // 主模型上下文窗口（token）；0 = 后端用默认 128k；用于分阶段 tool 压缩
  uint32 context_window = 29;
  // 主模型最大输出 token（来自模型元数据）；0 = 后端用默认（8192）
  uint32 max_output_tokens = 30;
  // 交互模式：agent | plan（空=agent）；用于 Plan 工具门禁
  string interaction_mode = 31;
  // 任务隔离：非空则 AgentLoop 以该路径为 project_root（file_ops/terminal 沙箱根）
  string project_root = 32;
  // OpenRouter default_parameters：未设置则沿用 Agent 默认温度
  optional float temperature = 33;
  // JSON object，合并进 ProviderConfig.additional_params（如 top_p / top_k）
  string additional_params_json = 34;
  // 备用供应商的视频/音乐模型覆盖
  string image_gen_fallback_video_model = 35;
  string image_gen_fallback_music_model = 36;
  // 前端队列身份；仅在输入持久化后通过 user_input_committed 回执。
  string client_message_id = 37;
  // 会话绑定的持久项目；服务端用于审计与恢复。
  string project_id = 38;
  // 当前项目全部可读写目录；第一个元素必须与 project_root（主 cwd）一致。
  repeated string workspace_roots = 39;
  reserved 40;
}

// 聊天多模态图片附件（OpenAI 兼容 image_url 的 data URL 原料）。
message ChatImageAttachment {
  string mime = 1;
  string data_base64 = 2;
}

// Chat 流控制动作。
enum ChatControlAction {
  CHAT_CONTROL_UNSPECIFIED = 0;
  CHAT_CONTROL_PAUSE = 1;
  CHAT_CONTROL_RESUME = 2;
  CHAT_CONTROL_CANCEL = 3;
  // 与 RESUME 同义：仅恢复流式生成，不可用于回答 interrupt
  CHAT_CONTROL_STREAM_RESUME = 4;
  // UI 新建对话：卸内存会话并触发 CommandNewChat / SessionReset / SessionFinalize
  CHAT_CONTROL_NEW_CHAT = 5;
  // 从磁盘重载活会话 AgentLoop 的 MEMORY/USER frozen snapshot
  CHAT_CONTROL_REFRESH_MEMORY = 6;
  // 仅释放后端会话运行时；不触发 new_chat hooks，冷会话与重复调用均成功
  RELEASE_SESSION = 7;
}

message ChatControlRequest {
  string session_id = 1;
  ChatControlAction action = 2;
}

// Codex-style steering：只接受已有活动 turn，不会隐式创建新任务。
message SteerChatRequest {
  string session_id = 1;
  string content = 2;
  repeated ChatImageAttachment images = 3;
  string expected_turn_id = 4;
  string client_message_id = 5;
}

message SteerChatResponse {
  bool accepted = 1;
  string turn_id = 2;
}

message SubscribeThreadEventsRequest {
  string connection_id = 1;
}

message SubmitTurnRequest {
  string connection_id = 1;
  ChatRequest chat = 2;
  string mode = 3;             // start_or_steer | start_if_idle | steer
  string expected_turn_id = 4; // required only for steer
}

message SubmitTurnResponse {
  string submission_id = 1;
  string turn_id = 2;
  string disposition = 3; // started | steered | resumed | not_submitted
  string reason = 4;
}

message RealtimeConversationRequest {
  string session_id = 1;
}

message RealtimeConversationStartRequest {
  string session_id = 1;
  string provider = 2;
  string model = 3;
  string api_key = 4;
  string base_url = 5;
  string output_modality = 6; // audio | text
  string voice = 7;
  string instructions = 8;
  optional bool include_startup_context = 9;
  string turn_detection = 10; // disabled | server_vad | semantic_vad
  string noise_reduction = 11; // empty | near_field | far_field
  reserved 12, 13;
  string connection_id = 14;
  string transport = 15; // websocket | webrtc | existing_call
  string sdp = 16; // browser offer for webrtc
  string call_id = 17; // required for existing_call
  string version = 18; // v2 | v3
  bool client_managed_handoffs = 19;
  string handoff_mode = 20; // thinking | commentary | bem_tags
  string handoff_channel_prefixes_json = 21;
  bool flush_transcript_tail_on_session_end = 22;
}

message RealtimeConversationAudioRequest {
  string session_id = 1;
  bytes data = 2;
  uint32 sample_rate = 3;
  uint32 num_channels = 4;
  string format = 5; // pcm16
}

message RealtimeConversationTextRequest {
  string session_id = 1;
  string text = 2;
  string role = 3; // user | developer | assistant
}

message RealtimeConversationSpeechRequest {
  string session_id = 1;
  string text = 2;
}

message RealtimeOperationResponse {
  string submission_id = 1;
}

message RealtimeVoicesResponse {
  repeated string voices = 1;
  string default_voice = 2;
}

message ResumeThreadRequest {
  string connection_id = 1;
  string thread_id = 2;
  bool include_turns = 3;
}

message ResumeThreadResponse {
  ThreadSnapshot thread = 1;
}

message UnsubscribeThreadRequest {
  string connection_id = 1;
  string thread_id = 2;
}

message ThreadSnapshot {
  string thread_id = 1;
  string status = 2; // idle | running | errored | shutdown
  repeated ThreadTurn turns = 3;
  ThreadTurn active_turn = 4;
  bool has_active_turn = 5;
  repeated string pending_background_turn_ids = 6;
  reserved 7;
}

message ThreadTurn {
  string id = 1;
  string status = 2; // in_progress | completed | failed | aborted
  repeated ThreadItem items = 3;
  string last_agent_message = 4;
  ThreadError error = 5;
  bool has_error = 6;
}

message ThreadItem {
  string id = 1;
  string item_type = 2;
  string status = 3; // in_progress | completed | failed
  string payload_json = 4;
}

message ThreadError {
  string message = 1;
  string error_type = 2;
}

message ThreadEvent {
  string thread_id = 1;
  string turn_id = 2;
  oneof payload {
    ThreadTurnStarted turn_started = 10;
    ThreadItemEvent item_started = 11;
    ThreadItemEvent item_completed = 12;
    ThreadDelta agent_message_delta = 13;
    ThreadDelta plan_delta = 14;
    ThreadDelta reasoning_delta = 15;
    ThreadDelta exec_output_delta = 16;
    ThreadDelta patch_delta = 17;
    ThreadControlRequest control_request = 18;
    ThreadTokenCount token_count = 19;
    ThreadError error = 20;
    ThreadError warning = 21;
    ThreadTurnComplete turn_complete = 22;
    ThreadTurnAborted turn_aborted = 23;
    ThreadExtension extension = 24;
    bool shutdown_complete = 25;
    ThreadRealtimeEvent realtime = 26;
  }
}

message ThreadRealtimeEvent {
  string kind = 1; // started | event | closed | voices
  string payload_json = 2;
}

message ThreadTurnStarted {
  string turn_id = 1;
}

message ThreadItemEvent {
  ThreadItem item = 1;
}

message ThreadDelta {
  string item_id = 1;
  string delta = 2;
}

message ThreadControlRequest {
  string kind = 1;
  string item_id = 2;
  string request_id = 3;
  string payload_json = 4;
}

message ThreadTokenCount {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 total_tokens = 3;
  uint64 uncached_input_tokens = 4;
  uint64 cache_read_tokens = 5;
  uint64 cache_write_tokens = 6;
  uint64 reasoning_tokens = 7;
  uint64 request_count = 8;
  uint64 provider_total_tokens = 9;
  bool provider_total_tokens_reported = 10;
  bool cache_read_reported = 11;
  bool cache_write_reported = 12;
  bool reasoning_reported = 13;
  bool input_tokens_include_cache = 14;
}

message ThreadTurnComplete {
  string last_agent_message = 1;
  ThreadError error = 2;
  bool has_error = 3;
}

message ThreadTurnAborted {
  string reason = 1;
}

message ThreadExtension {
  string item_id = 1;
  string namespace = 2;
  string payload_json = 3;
}

message InterruptResumeItem {
  string interrupt_id = 1;
  // resolved | cancelled
  string status = 2;
  string payload_json = 3;
}

message InterruptResumeRequest {
  string session_id = 1;
  repeated InterruptResumeItem resume = 2;
}

message ResolveElicitationRequest {
  string session_id = 1;
  string server_name = 2;
  string request_id = 3;
  string action = 4; // accept | decline | cancel
  string content_json = 5;
  string meta_json = 6;
}

message UpdateTurnSettingsRequest {
  string session_id = 1;
  string turn_id = 2;
  optional string model = 3;
  optional string reasoning_effort = 4;
  optional string reasoning_summary = 5;
  optional string service_tier = 6;
}

message UpdateTurnSettingsResponse {
  string status = 1; // applied | target_unavailable | rejected
  string message = 2;
}

message ApproveGuardianDeniedActionRequest {
  string session_id = 1;
  string assessment_id = 2;
}

message RunUserShellCommandRequest {
  string session_id = 1;
  string command = 2;
  string cwd = 3;
}

message RunUserShellCommandResponse {
  string submission_id = 1;
  string turn_id = 2;
  string item_id = 3;
  bool attached_to_active_turn = 4;
}

message TerminalOpenRequest {
  string scope = 1;
  string cwd = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // "project" keeps workspace-write sandboxing; "system" launches the user's
  // login shell without the project filesystem sandbox.
  string execution_mode = 5;
  // Desktop settings may deliberately replace an existing shell when its mode
  // no longer matches. Agent callers continue to reuse the active session.
  bool replace_mode_mismatch = 6;
}

message TerminalIdRequest { uint64 id = 1; }

message TerminalReadRequest {
  uint64 id = 1;
  uint64 cursor = 2;
  uint32 max_bytes = 3;
  uint32 wait_ms = 4;
}

message TerminalWriteRequest {
  uint64 id = 1;
  bytes data = 2;
}

message TerminalResizeRequest {
  uint64 id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalSessionResponse {
  uint64 id = 1;
  string scope = 2;
  string cwd = 3;
  bool running = 4;
  optional uint32 exit_code = 5;
  uint64 base_cursor = 6;
  uint64 end_cursor = 7;
}

message TerminalReadResponse {
  uint64 id = 1;
  bytes data = 2;
  uint64 next_cursor = 3;
  bool dropped = 4;
  bool running = 5;
  optional uint32 exit_code = 6;
}

message ImageRequest {
  string prompt = 1;
  string provider = 2;
  string model = 3;
  int32 width = 4;
  int32 height = 5;
  int32 count = 6;
  string api_key = 7;
  string base_url = 8;
}

message ImageEvent {
  oneof payload {
    string progress = 1;
    bytes image_data = 2;
    string error = 3;
  }
}

message SkillRequest { string name = 1; string params_json = 2; }
message SkillEvent { oneof payload { string output = 1; string error = 2; bool done = 3; } }
message SkillList { repeated SkillInfo skills = 1; }
message SkillInfo { string name = 1; string description = 2; string category = 3; }

message McpServerListRequest {
  string agent_id = 1;
  string project_root = 2;
}
message McpReconnectRequest {
  string agent_id = 1;
  string server_id = 2;
}
message McpServerList { repeated McpServerInfo servers = 1; }
message McpServerInfo {
  string name = 1;
  string status = 2;
  repeated string tools = 3;
  bool required = 4;
  string error = 5;
  string id = 6;
  bool retryable = 7;
  uint32 retry_attempt = 8;
  uint64 next_retry_at_unix_ms = 9;
  bool oauth_available = 10;
  bool authenticated = 11;
}

message MemoryQuery { string query = 1; int32 limit = 2; }
message MemoryResult { string memory_content = 1; string user_content = 2; repeated SessionSnippet sessions = 3; }
message SessionSnippet { string session_id = 1; string summary = 2; }

message FileListRequest { string path = 1; int32 depth = 2; }
message FileListResponse { repeated FileEntry entries = 1; }
message FileEntry { string path = 1; bool is_dir = 2; int64 size = 3; }

// ---------------------------------------------------------------------------
// Token Counting & Batch API
// ---------------------------------------------------------------------------

message CountTokensRequest {
  string agent_id = 1;
  string model = 2;
  string messages_json = 3;
  string tools_json = 4;
}
message CountTokensResponse {
  uint32 input_tokens = 1;
}

message BatchCreateRequest {
  string agent_id = 1;
  string requests_json = 2;
}
message BatchStatusRequest {
  string agent_id = 1;
  string batch_id = 2;
}
message BatchListRequest {
  string agent_id = 1;
}
message BatchResponse {
  string response_json = 1;
}
message BatchResultsResponse {
  string results_jsonl = 1;
}
