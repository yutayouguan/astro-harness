[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[features]
test-support = []

[dependencies]
types = { path = "../agent-types" }
memory = { path = "../agent-memory" }
home = { path = "../agent-home" }
session = { path = "../agent-session" }
usage = { path = "../agent-usage" }
subagents = { path = "../agent-subagents" }
cron = { path = "../agent-cron" }
skills = { path = "../agent-skills" }
providers = { path = "../agent-providers" }
tools = { path = "../agent-tools" }
mcp = { path = "../agent-mcp" }
a2ui = { path = "../agent-a2ui" }
artifacts = { path = "../agent-artifacts" }
hooks = { path = "../agent-hooks" }
sandbox = { path = "../agent-sandbox" }
network-proxy = { path = "../agent-network-proxy" }
agent-protocol = { path = "../agent-protocol" }
agent-rollout = { path = "../agent-rollout" }
realtime = { path = "../agent-realtime" }
agent-extensions = { path = "../agent-extensions" }
agent-config = { path = "../agent-config" }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
regex = "1"
async-channel = "2"
base64 = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3"
agent-db = { path = "../agent-db" }
tokio = { workspace = true, features = ["test-util"] }
