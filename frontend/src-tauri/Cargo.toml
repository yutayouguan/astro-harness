[package]
name = "astro-agent"
version = "0.1.0"
description = "Astro Agent Tauri frontend"
authors = ["Astro Agent"]
edition = "2021"

[lib]
name = "astro_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "astro-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proto = { path = "../../storage/proto" }
common = { path = "../../storage/common" }
memory = { path = "../../core/memory" }
home = { path = "../../core/home" }
cron = { path = "../../automation/cron" }
artifacts = { path = "../../storage/artifacts" }
usage = { path = "../../storage/usage" }
orchestration = { path = "../../core/orchestration" }
session = { path = "../../storage/session" }
agent = { path = "../../core/agent" }
delegate = { path = "../../core/delegate" }
backend = { path = "../../channels/server" }
tools = { path = "../../actions/tools" }
mcp = { path = "../../extensions/mcp" }
providers = { path = "../../core/providers" }
skills = { path = "../../core/skills" }
evolution = { path = "../../core/evolution" }
workflow = { path = "../../automation/workflow" }
chrono = { version = "0.4", features = ["clock"] }
url = "2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
base64 = "0.22"
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
