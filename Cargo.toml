[workspace]
members = [
    # core — 代理大脑
    "core/agent",
    "core/providers",
    "core/memory",
    "core/orchestration",
    "core/evolution",
    "core/delegate",
    "core/home",
    "core/skills",

    # actions — 工具实现
    "actions/tools",
    "actions/a2ui",

    # channels — 对外通道
    "channels/server",

    # storage — 持久化与共享类型
    "storage/common",
    "storage/proto",
    "storage/session",
    "storage/artifacts",
    "storage/usage",

    # automation — 自动化
    "automation/cron",
    "automation/workflow",

    # extensions — 可插拔扩展
    "extensions/mcp",
    "extensions/hooks",

    # frontend — 前端
    "frontend/src-tauri",
]
resolver = "2"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
schemars = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
