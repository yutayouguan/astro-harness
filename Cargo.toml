[workspace]
members = [
    "proto",
    "common",
    "memory-paths",
    "memory-agent",
    "backend",
    "agent",
    "providers",
    "memory",
    "skills",
    "tools",
    "mcp",
    "hooks",
    "frontend/src-tauri",
    "a2ui",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
schemars = "0.8"
