[workspace]
members = [
    "crates/agent-types",
    "crates/agent-protocol",
    "crates/agent-rollout",
    "crates/agent-home",
    "crates/agent-skills",
    "crates/agent-hooks",
    "crates/agent-providers",
    "crates/agent-proto",
    "crates/agent-session",
    "crates/agent-artifacts",
    "crates/agent-usage",
    "crates/agent-mcp",
    "crates/agent-memory",
    "crates/agent-network-proxy",
    "crates/agent-sandbox",
    "crates/agent-delegate",
    "crates/agent-subagents",
    "crates/agent-evolution",
    "crates/agent-cron",
    "crates/agent-workflow",
    "crates/agent-a2ui",
    "crates/agent-tools",
    "crates/agent-core",
    "crates/agent-server",
    "apps/desktop/src-tauri",
]
resolver = "2"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
schemars = "0.8"
globset = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "macos-system-configuration"], default-features = false }
