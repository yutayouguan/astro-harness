# 不创建 Release，仅构建并上传产物（用于验证 Windows / Linux / macOS 打包）。
#
# 注意：该文件必须位于默认分支（develop）上，GitHub 才会注册这个 workflow；
# 只存在于非默认分支时，Actions 页面不会出现 build-tauri。
#
# 计费：私有仓库的 macOS runner 按 10 倍、Windows 按 2 倍消耗每月额度。
# 因此 PR 只构建 Linux（1 倍、最快），手动触发才跑满三平台矩阵。

name: build-tauri

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-tauri.yml"

permissions:
  contents: read

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 生成构建矩阵：PR 只跑 Linux，手动触发跑全平台。
  plan:
    name: 计算构建矩阵
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: 选择矩阵
        id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'include=[{"platform":"ubuntu-22.04","args":"","rust_targets":"","artifact":"linux-x64","bundles":""}]' >> "$GITHUB_OUTPUT"
          else
            echo 'include=[{"platform":"macos-latest","args":"--target aarch64-apple-darwin","rust_targets":"aarch64-apple-darwin","artifact":"macos-aarch64","bundles":""},{"platform":"macos-latest","args":"--target x86_64-apple-darwin","rust_targets":"x86_64-apple-darwin","artifact":"macos-x86_64","bundles":""},{"platform":"ubuntu-22.04","args":"","rust_targets":"","artifact":"linux-x64","bundles":""},{"platform":"windows-latest","args":"","rust_targets":"","artifact":"windows-x64","bundles":"--bundles nsis"}]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libdbus-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: build-${{ matrix.artifact }}
          # 构建失败（例如打包阶段）也保留依赖缓存，避免每次重编整棵依赖树
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: apps/desktop
        # 前端存在 @lobehub/icons → @lobehub/ui → react 19 的 peer 冲突，
        # 与 quality 工作流保持一致，用 --legacy-peer-deps 安装锁定版本。
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npm run tauri build -- ${{ matrix.args }} ${{ matrix.bundles }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: astro-agent-${{ matrix.artifact }}
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
