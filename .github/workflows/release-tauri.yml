# 在 macOS / Windows / Linux 上构建 Astro Agent 桌面安装包。
# 触发：手动运行或推送 v* 标签。
# 产物写入独立的公开 Release 仓库；私有源码不会被推送过去。

name: release-tauri

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libdbus-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public release configuration
        env:
          ASTRO_RELEASE_TOKEN: ${{ secrets.ASTRO_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          node -e "for (const key of ['ASTRO_RELEASE_TOKEN','TAURI_SIGNING_PRIVATE_KEY','TAURI_SIGNING_PRIVATE_KEY_PASSWORD']) if (!process.env[key]) { console.error('Missing release configuration: ' + key); process.exitCode = 1 }"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: tauri-${{ matrix.platform }}-${{ matrix.rust_targets || 'host' }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRO_RELEASE_TOKEN }}
          ASTRO_UPDATE_ENDPOINT: https://github.com/yutayouguan/astro-agent-releases/releases/latest/download/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          owner: yutayouguan
          repo: astro-agent-releases
          tagName: v__VERSION__
          releaseName: Astro Agent v__VERSION__
          releaseBody: |
            ## 安装包

            - **macOS Apple Silicon (ARM64)**：`aarch64-apple-darwin` 的 `.dmg` / `.app`
            - **macOS Intel (x86_64)**：`x86_64-apple-darwin` 的 `.dmg` / `.app`
            - **Windows x64**：`.msi` / `.exe`（NSIS）
            - **Linux x64**：`.AppImage` / `.deb`

            详见本 Release 的 Assets。
          releaseDraft: false
          prerelease: false
          releaseCommitish: main
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # 基础配置默认关闭 updater 产物，让普通 `npm run tauri build` 与打包校验
          # 不需要私钥；发布通道在这里显式打开，配合 TAURI_SIGNING_PRIVATE_KEY 签名。
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
