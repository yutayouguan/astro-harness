# 在 macOS / Windows / Linux 上构建 Astro Agent 桌面安装包。
# 触发：手动运行、push 到 release 分支、打 v* 标签。
# 产物会写入草稿 GitHub Release（tagName 中的 __VERSION__ 由 tauri-action 替换）。

name: release-tauri

on:
  workflow_dispatch:
  push:
    branches:
      - release
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: tauri-${{ matrix.platform }}-${{ matrix.rust_targets || 'host' }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: Astro Agent v__VERSION__
          releaseBody: |
            ## 安装包

            - **macOS Apple Silicon (ARM64)**：`aarch64-apple-darwin` 的 `.dmg` / `.app`
            - **macOS Intel (x86_64)**：`x86_64-apple-darwin` 的 `.dmg` / `.app`
            - **Windows x64**：`.msi` / `.exe`（NSIS）
            - **Linux x64**：`.AppImage` / `.deb`

            详见本 Release 的 Assets。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
